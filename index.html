<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGGURAT LIBRARY</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0a0a0a; color: #ffffff; margin: 0; padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; border-bottom: 1px solid #222; padding-bottom: 40px; margin-bottom: 50px; }
        h1 { letter-spacing: 6px; color: #d4af37; font-size: 2.2rem; margin: 0; font-weight: 300; }
        p { color: #555; margin-top: 10px; font-size: 0.9rem; letter-spacing: 2px; }
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .book-card { background: #111; border: 1px solid #1a1a1a; padding: 30px; border-radius: 4px; transition: all 0.4s ease; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .book-card:hover { border-color: #d4af37; background: #161616; }
        .book-name { font-size: 0.95rem; font-weight: 400; margin-bottom: 25px; color: #ccc; line-height: 1.5; letter-spacing: 1px; }
        .download-btn { background: transparent; border: 1px solid #444; color: #888; padding: 12px; text-decoration: none; text-align: center; border-radius: 2px; font-size: 0.8rem; font-weight: bold; transition: 0.3s; letter-spacing: 1px; }
        .download-btn:hover { border-color: #d4af37; color: #d4af37; }
        #status { text-align: center; color: #444; font-size: 0.9rem; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ZIGGURAT LIBRARY</h1>
        <p>DIGITAL ARCHIVE</p>
    </header>

    <div id="status">INITIALIZING ARCHIVE...</div>
    <div class="library-grid" id="viewer"></div>
</div>

<script>
    const GITHUB_USER = 'ziggurah'; 
    const REPO_NAME = 'ZIGGURAT-LIBRARY';
    const FOLDER_PATH = 'books';

    async function fetchArchive() {
        const viewer = document.getElementById('viewer');
        const status = document.getElementById('status');
        
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
            if (!response.ok) throw new Error('Not Found');
            const files = await response.json();
            
            status.style.display = 'none';
            files.forEach(file => {
                const isDoc = file.name.toLowerCase().match(/\.(pdf|epub|mobi)$/);
                if (isDoc) {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    const displayName = file.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
                    
                    card.innerHTML = `
                        <div class="book-name">${displayName.toUpperCase()}</div>
                        <a href="${file.download_url}" class="download-btn" target="_blank">ACCESS DOCUMENT</a>
                    `;
                    viewer.appendChild(card);
                }
            });
        } catch (err) {
            status.innerText = 'SYSTEM ERROR: ARCHIVE INACCESSIBLE';
        }
    }

    fetchArchive();
</script>

</body>
</html>
