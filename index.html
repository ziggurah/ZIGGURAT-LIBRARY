<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGGURAT LIBRARY</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/d4af37/temple.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --text: #ececec; }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg);
            background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: var(--text); margin: 0; padding: 0; 
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; padding: 60px 0; border-bottom: 1px solid var(--gold); }
        h1 { letter-spacing: 12px; color: var(--gold); font-size: 3.5rem; margin: 0; font-weight: 300; text-transform: uppercase; }
        
        .temple-box { 
            background: rgba(20, 20, 20, 0.85); border: 1px solid #333;
            padding: 40px; margin: 50px 0; border-radius: 2px; backdrop-filter: blur(10px);
        }

        /* Donation Section Styles */
        .donation-container { background: #000; border: 1px solid #222; margin-top: 30px; }
        .donation-tabs { display: flex; background: #111; border-bottom: 1px solid #222; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #555; cursor: pointer; font-size: 0.75rem; letter-spacing: 2px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); background: #000; border-bottom: 2px solid var(--gold); }
        
        /* Content Visibility Control */
        .donation-content { display: none; flex-wrap: wrap; gap: 25px; align-items: center; padding: 25px; }
        
        .qr-code { width: 140px; height: 140px; border: 1px solid var(--gold); background: #fff; padding: 5px; }
        .wallet-info { flex: 1; min-width: 250px; position: relative; }
        .wallet-addr { font-family: monospace; color: var(--gold); font-size: 0.85rem; word-break: break-all; display: block; margin: 10px 0; background: #0a0a0a; padding: 12px; border: 1px dotted #444; cursor: pointer; }
        
        .pay-now-btn {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 5px; padding: 10px 18px;
            background: var(--gold); color: #000; text-decoration: none; font-weight: bold; font-size: 0.7rem; border-radius: 2px;
        }

        .copy-toast { position: absolute; top: -25px; right: 0; color: var(--gold); font-size: 0.65rem; display: none; }

        /* Library Grid */
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-top: 50px; }
        .book-card { background: rgba(15, 15, 15, 0.95); border: 1px solid #1a1a1a; padding: 40px 20px; text-align: center; position: relative; }
        .book-name { font-size: 1rem; margin-bottom: 30px; display: block; color: #fff; height: 45px; overflow: hidden; }
        .btn-group { display: flex; gap: 10px; }
        .btn { border: 1px solid var(--gold); color: var(--gold); padding: 10px 5px; text-decoration: none; font-size: 0.7rem; flex: 1; font-weight: bold; }
        
        .social-bar { display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #222; padding-top: 20px; align-items: center; }
        .share-icons a { color: #555; font-size: 1.3rem; margin-right: 15px; }
        #status { text-align: center; color: var(--gold); margin-top: 60px; letter-spacing: 5px; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>ZIGGURAT</h1></header>
    
    <section class="temple-box">
        <h2>SUPPORT THE ARCHIVE</h2>
        <div class="donation-container">
            <div class="donation-tabs">
                <button class="tab-btn active" onclick="showTab('trust-tab', this)">TRUST (BEP20)</button>
                <button class="tab-btn" onclick="showTab('tron-tab', this)">TRON (TRC20)</button>
                <button class="tab-btn" onclick="showTab('btc-tab', this)">BITCOIN</button>
            </div>

            <div id="trust-tab" class="donation-content" style="display: flex;">
                <img src="qr/qr-trust.jpg" class="qr-code">
                <div class="wallet-info">
                    <span style="font-size: 0.7rem; color: #666;">BSC/ETH NETWORK</span>
                    <span id="t1" class="copy-toast">COPIED!</span>
                    <span class="wallet-addr" onclick="copyValue('0x52Ec698495e5B1d71B21ed05D1Df3F3a9F929889', 't1')">0x52Ec698495e5B1d71B21ed05D1Df3F3a9F929889</span>
                    <a href="ethereum:0x52Ec698495e5B1d71B21ed05D1Df3F3a9F929889" class="pay-now-btn"><i class="fas fa-heart"></i> DONATE NOW!</a>
                </div>
            </div>

            <div id="tron-tab" class="donation-content">
                <img src="qr/qr-tron.jpg" class="qr-code">
                <div class="wallet-info">
                    <span style="font-size: 0.7rem; color: #666;">TRON NETWORK (TRC20)</span>
                    <span id="t2" class="copy-toast">COPIED!</span>
                    <span class="wallet-addr" onclick="copyValue('TKHRHcKJA6saAX4xJu7ip2T9HWVThpj1Rm', 't2')">TKHRHcKJA6saAX4xJu7ip2T9HWVThpj1Rm</span>
                    <a href="tron:TKHRHcKJA6saAX4xJu7ip2T9HWVThpj1Rm" class="pay-now-btn"><i class="fas fa-heart"></i> DONATE NOW!</a>
                </div>
            </div>

            <div id="btc-tab" class="donation-content">
                <img src="qr/qr-btc.jpg" class="qr-code">
                <div class="wallet-info">
                    <span style="font-size: 0.7rem; color: #666;">BITCOIN NETWORK</span>
                    <span id="t3" class="copy-toast">COPIED!</span>
                    <span class="wallet-addr" onclick="copyValue('bc1qzq228lmc4ctcldfqa23hq52qetywfrqr3kmv8r', 't3')">bc1qzq228lmc4ctcldfqa23hq52qetywfrqr3kmv8r</span>
                    <a href="bitcoin:bc1qzq228lmc4ctcldfqa23hq52qetywfrqr3kmv8r" class="pay-now-btn"><i class="fas fa-heart"></i> DONATE NOW!</a>
                </div>
            </div>
        </div>

        <div class="social-bar">
            <div class="share-icons">
                <a href="#"><i class="fab fa-telegram"></i></a>
                <a href="#"><i class="fab fa-x-twitter"></i></a>
            </div>
            <div class="contact-links">
                <a href="mailto:oracle1903@gmail.com" style="color:var(--gold); text-decoration:none;">EMAIL</a>
            </div>
        </div>
    </section>

    <div id="status">UNVEILING THE ARCHIVES...</div>
    <div class="library-grid" id="viewer"></div>
</div>

<script>
    // سیستم تب‌بندی فوق‌ساده و تضمینی
    function showTab(tabId, btn) {
        // ۱. همه محتواها رو مخفی کن
        var contents = document.getElementsByClassName("donation-content");
        for (var i = 0; i < contents.length; i++) {
            contents[i].style.display = "none";
        }
        
        // ۲. همه دکمه‌ها رو از حالت فعال دربیار
        var tabs = document.getElementsByClassName("tab-btn");
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove("active");
        }
        
        // ۳. محتوای مورد نظر رو نشون بده و دکمه رو فعال کن
        document.getElementById(tabId).style.display = "flex";
        btn.classList.add("active");
    }

    function copyValue(text, toastId) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById(toastId);
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        });
    }

    // بخش فچ کردن کتاب‌ها (همون کد قبلی)
    const GITHUB_USER = 'ziggurah'; 
    const REPO_NAME = 'ZIGGURAT-LIBRARY';
    const FOLDER_PATH = 'books';
    const BRANCH = 'Ziggurat-Library';

    async function fetchArchive() {
        const viewer = document.getElementById('viewer');
        const status = document.getElementById('status');
        try {
            const cacheBuster = Math.random();
            const descUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${FOLDER_PATH}/descriptions.json?v=${cacheBuster}`;
            const descRes = await fetch(descUrl);
            const descriptions = await descRes.json();
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
            const allFiles = await response.json();
            status.style.display = 'none';
            viewer.innerHTML = '';
            Object.keys(descriptions).forEach(jsonKey => {
                const file = allFiles.find(f => f.name.trim() === jsonKey.trim());
                if (file) {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    const displayName = file.name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
                    const viewUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(file.download_url)}&embedded=true`;
                    card.innerHTML = `<i class="fas fa-book-open" style="color:var(--gold); font-size:2rem; margin-bottom:15px;"></i><div class="book-name">${displayName.toUpperCase()}</div><div class="btn-group"><a href="${file.download_url}" class="btn" target="_blank">Download</a><a href="${viewUrl}" class="btn" target="_blank">Read Online</a></div>`;
                    viewer.appendChild(card);
                }
            });
        } catch (err) { status.innerText = 'THE ARCHIVE IS OFFLINE'; }
    }
    fetchArchive();
</script>
</body>
</html>
