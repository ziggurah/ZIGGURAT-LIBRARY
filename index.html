<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGGURAT LIBRARY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --text: #ececec; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg);
            /* بک‌گراند کتابخانه‌ای تیره و محو */
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-attachment: fixed;
            color: var(--text); margin: 0; padding: 0; 
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }

        header { text-align: center; padding: 60px 0; border-bottom: 1px solid var(--gold); }
        h1 { letter-spacing: 12px; color: var(--gold); font-size: 3rem; margin: 0; font-weight: 300; }
        .subtitle { letter-spacing: 5px; color: #999; font-size: 1rem; margin-top: 15px; }

        .temple-box { 
            background: rgba(22, 22, 22, 0.9); border: 1px solid #333;
            padding: 40px; margin: 50px 0; border-radius: 4px; backdrop-filter: blur(5px);
        }
        
        .temple-box h2 { color: var(--gold); font-size: 1.2rem; letter-spacing: 3px; margin-top: 0; font-weight: 400; }

        .donation-section { 
            display: flex; flex-wrap: wrap; gap: 25px; align-items: center; 
            background: #000; padding: 25px; border: 1px solid var(--gold); margin: 20px 0;
        }
        /* اصلاح نمایش بارکد */
        .qr-code { width: 140px; height: 140px; background: #fff; padding: 5px; }

        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 50px; }
        
        .book-card { 
            background: rgba(17, 17, 17, 0.95); border: 1px solid #222; padding: 30px 20px; text-align: center;
            transition: 0.4s; position: relative; cursor: help;
        }
        .book-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        
        /* Tooltip / Summary Pop-up on Hover */
        .book-card::after {
            content: "Click to see more or read online. Knowledge is the only light.";
            position: absolute; bottom: 105%; left: 5%; right: 5%;
            background: var(--gold); color: #000; padding: 10px; font-size: 0.8rem;
            border-radius: 4px; visibility: hidden; opacity: 0; transition: 0.3s; z-index: 10;
        }
        .book-card:hover::after { visibility: visible; opacity: 1; }

        .book-card i { font-size: 2.5rem; color: var(--gold); margin-bottom: 20px; }
        .book-name { font-size: 0.9rem; margin-bottom: 25px; display: block; color: #ddd; height: 40px; overflow: hidden; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { 
            border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; 
            text-decoration: none; font-size: 0.7rem; transition: 0.3s; flex: 1;
        }
        .btn:hover { background: var(--gold); color: #000; }

        #status { text-align: center; color: var(--gold); margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ZIGGURAT</h1>
        <div class="subtitle">CIVILISATION STARTS HERE</div>
    </header>

    <section class="temple-box">
        <h2>YOU ARE STANDING IN A TEMPLE</h2>
        <p>You have entered a zone of free transmission. These works are <strong>Seeds of Change</strong>. Civilisation is not a gift; it is a construction.</p>
        
        <div class="donation-section">
            <img src="qr.jpg" class="qr-code" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=UQCFGBUjsD6T-9Vf9-fDiu6qV2jAjejc8ed-2hYn4JwYw-2i'">
            <div class="wallet-info">
                <span style="font-size: 0.7rem; color: #888;">DONATE USDT / TON</span>
                <span style="font-family: monospace; color: var(--gold); display: block; word-break: break-all;">UQCFGBUjsD6T-9Vf9-fDiu6qV2jAjejc8ed-2hYn4JwYw-2i</span>
            </div>
        </div>

        <div style="margin-top:20px;">
            <a href="mailto:oracle1903@gmail.com" style="color:var(--gold); text-decoration:none; margin-right:20px;"><i class="fas fa-envelope"></i> Email</a>
            <a href="https://t.me/persianmagilibrary" style="color:var(--gold); text-decoration:none;"><i class="fab fa-telegram"></i> Telegram</a>
        </div>
    </section>

    <div id="status">ARCHIVE LOADING...</div>
    <div class="library-grid" id="viewer"></div>
</div>

<script>
    const GITHUB_USER = 'ziggurah'; 
    const REPO_NAME = 'ZIGGURAT-LIBRARY';
    const FOLDER_PATH = 'books';

    async function fetchArchive() {
        const viewer = document.getElementById('viewer');
        const status = document.getElementById('status');
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${FOLDER_PATH}`);
            if (!response.ok) throw new Error();
            const files = await response.json();
            
            status.style.display = 'none';
            viewer.innerHTML = ''; // پاک کردن لودینگ قدیمی

            files.forEach(file => {
                if (file.name.toLowerCase().endsWith('.pdf')) {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    const name = file.name.replace('.pdf', '').replace(/[_-]/g, ' ');
                    
                    // لینک مطالعه آنلاین با Google Docs Viewer
                    const viewUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(file.download_url)}&embedded=true`;

                    card.innerHTML = `
                        <i class="fas fa-book-open"></i>
                        <span class="book-name">${name.toUpperCase()}</span>
                        <div class="btn-group">
                            <a href="${file.download_url}" class="btn" target="_blank">DOWNLOAD</a>
                            <a href="${viewUrl}" class="btn" target="_blank">READ ONLINE</a>
                        </div>
                    `;
                    viewer.appendChild(card);
                }
            });
        } catch (err) { 
            status.innerText = 'ARCHIVE READY / NO FILES FOUND'; 
        }
    }
    fetchArchive();
</script>

</body>
</html>
