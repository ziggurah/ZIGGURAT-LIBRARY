<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGGURAT LIBRARY</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/d4af37/temple.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --text: #ececec; }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg);
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=2000');
            background-size: cover; background-attachment: fixed; background-position: center;
            color: var(--text); margin: 0; padding: 0; 
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; padding: 60px 0; border-bottom: 1px solid var(--gold); }
        h1 { letter-spacing: 12px; color: var(--gold); font-size: 3.5rem; margin: 0; font-weight: 300; text-transform: uppercase; }
        .subtitle { letter-spacing: 5px; color: #666; font-size: 1rem; margin-top: 15px; }
        
        .temple-box { 
            background: rgba(20, 20, 20, 0.85); border: 1px solid #333;
            padding: 40px; margin: 50px 0; border-radius: 2px; backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .temple-box h2 { color: var(--gold); font-size: 1.3rem; letter-spacing: 4px; margin-top: 0; font-weight: 400; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .temple-box p { line-height: 1.8; color: #bbb; font-size: 1.05rem; margin-top: 20px; }

        .donation-container { background: #000; border: 1px solid #222; margin-top: 30px; overflow: hidden; }
        .donation-tabs { display: flex; background: #111; border-bottom: 1px solid #222; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 100px; padding: 15px 5px; border: none; background: none; color: #555; cursor: pointer; font-size: 0.7rem; letter-spacing: 1px; transition: 0.3s; font-weight: bold; }
        .tab-btn.active { color: var(--gold); background: #000; border-bottom: 2px solid var(--gold); }
        .donation-content { display: none; flex-wrap: wrap; gap: 25px; align-items: center; padding: 25px; }
        
        .qr-code { width: 140px; height: 140px; border: 1px solid var(--gold); background: #fff; padding: 5px; cursor: pointer; }
        .wallet-info { flex: 1; min-width: 250px; position: relative; }
        .wallet-addr { font-family: monospace; color: var(--gold); font-size: 0.85rem; word-break: break-all; display: block; margin: 10px 0; background: #0a0a0a; padding: 12px; border: 1px dotted #444; cursor: pointer; transition: 0.3s; }
        .wallet-addr:hover { border-color: var(--gold); background: #111; }
        .copy-toast { position: absolute; top: -25px; right: 0; color: var(--gold); font-size: 0.65rem; letter-spacing: 1px; display: none; }

        .pay-now-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 5px; padding: 10px 18px; background: var(--gold); color: #000; text-decoration: none; font-weight: bold; font-size: 0.7rem; letter-spacing: 1px; border-radius: 2px; }

        .social-bar { display: flex; flex-wrap: wrap; justify-content: space-between; margin-top: 30px; border-top: 1px solid #222; padding-top: 20px; align-items: center; gap: 20px; }
        .share-icons { display: flex; gap: 18px; align-items: center; }
        .share-icons a { color: #555; font-size: 1.3rem; transition: 0.3s; text-decoration: none; }
        .share-icons a:hover { color: var(--gold); transform: translateY(-3px); }
        .archive-vault-link { color: var(--gold); text-decoration: none; font-size: 0.8rem; letter-spacing: 1px; font-weight: bold; display: flex; align-items: center; gap: 8px; border-left: 1px solid #333; padding-left: 20px; }
        
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-top: 50px; }
        .book-card { background: rgba(15, 15, 15, 0.95); border: 1px solid #1a1a1a; padding: 40px 20px; text-align: center; transition: 0.4s; position: relative; }
        .book-card:hover { border-color: var(--gold); transform: translateY(-8px); background: #1a1a1a; }
        .book-tooltip { position: absolute; bottom: 105%; left: 10%; right: 10%; background: var(--gold); color: #000; padding: 12px; font-size: 0.8rem; border-radius: 4px; visibility: hidden; opacity: 0; transition: 0.3s; z-index: 100; font-weight: 500; pointer-events: none; }
        .book-card:hover .book-tooltip { visibility: visible; opacity: 1; }
        .book-card i { font-size: 3rem; color: var(--gold); margin-bottom: 25px; opacity: 0.6; }
        .book-name { font-size: 1rem; margin-bottom: 30px; display: block; color: #fff; height: 45px; overflow: hidden; letter-spacing: 1px; }
        .btn { border: 1px solid var(--gold); color: var(--gold); padding: 10px 5px; text-decoration: none; font-size: 0.7rem; flex: 1; font-weight: bold; text-transform: uppercase; }
